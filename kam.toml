[prop]
id = "magicap"
name = "Magicap"
version = "v0.1.1"
versionCode = 2
author = "LIghtJUNction"
description = "Android traffic inspection, local CA, WebUI and MCP"
updateJson = "https://raw.githubusercontent.com/LIghtJUNction/Magicap/main/update.json"
metamodule = false

[mmrl.repo]
license = "MIT"
license_file = "LICENSE"
homepage = "https://github.com/LIghtJUNction/Magicap"
readme = ""
readme_file = "README.md"
changelog = ""
changelog_file = "CHANGELOG.md"
screenshots = []
categories = ["tools"]
keywords = [
    "kam",
    "module",
    "android",
    "template",
]
maintainers = []
repository = "https://github.com/LIghtJUNction/Magicap"
documentation = ""
issues = ""
funding = "https://github.com/sponsors/LightJunction"
support = ""
donate = ""
cover = ""
icon = "icon.png"
devices = []
arch = ["arm64-v8a", "x86_64"]
require = []
antifeatures = []
max_num = 0
min_api = 26
max_api = 0
verified = false
features = [
    "webui",
    "capture",
]

[mmrl.repo.note]
title = ""
message = ""

[mmrl.repo.manager.magisk]
devices = []
arch = []
require = []

[mmrl.repo.manager.kernelsu]
devices = []
arch = []
require = []

[mmrl.repo.manager.apatch]
devices = []
arch = []
require = []

[mmrl.repo.options.archive]
compression = ""

[kam]
min_api = 0
max_api = 0
supported_arch = ["arm64-v8a", "x86_64"]
conflicts = []
module_type = "kam"

[kam.build]
source_dir = "src/magicap"
target_dir = "dist"
output_file = "{{id}}"
hooks_dir = "hooks"
exclude = [
    "system/etc/security/cacerts/*",
    ".git/",
    "target/",
    "node_modules/",
    ".DS_Store",
    "Thumbs.db",
    "*.tmp",
    "*.log",
    "*.bak",
    ".kam/",
]
include = []
respect_gitignore = false

[kam.tmpl.variables.repository]
var_type = "string"
required = false
default = ""
note = "GitHub repository URL (optional)"
help = "The GitHub repository URL where your module source code is hosted"
example = "https://github.com/user/repo"

[kam.workspace]
members = ["."]

[tool]

[dev.mcp]
enabled = false
port = 8765
local_port = 8765
endpoint = "/mcp"
transport = "streamable-http"
